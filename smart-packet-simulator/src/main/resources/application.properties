# Server configuration
server.port=8080
server.error.include-message=always

# Application name
spring.application.name=smart-packet-simulator

# Development logging
logging.level.com.network.simulator=DEBUG
logging.level.org.springframework=INFO
logging.level.org.apache.catalina=INFO
logging.level.org.apache.tomcat=INFO

# Console pattern for readable development output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# JSON logging output
logging.pattern.json-file=

# DevTools: restart on classpath changes
spring.devtools.restart.trigger-file=.restarttrigger
spring.devtools.livereload.enabled=true

# Thymeleaf (not used yet, but avoids template-related warnings)
spring.thymeleaf.prefix=classpath:/templates/